<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Zappar WebAR Video Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        overflow: hidden;
        background: #000;
      }

      #ar-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 16px;
        z-index: 999;
        display: none;
      }

      #loading.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="ar-container">
      <canvas id="canvas"></canvas>
      <div id="loading" class="active">Loading AR experience...</div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>

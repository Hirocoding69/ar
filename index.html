<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>AR Video Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Loading Screen -->
      <div id="loading-screen" class="screen active">
        <div class="loading-content">
          <div class="spinner"></div>
          <h2>Initializing AR...</h2>
          <p id="loading-message">Requesting camera access</p>
        </div>
      </div>

      <!-- Setup Screen -->
      <div id="setup-screen" class="screen">
        <div class="setup-content">
          <h1>AR Video Tracker</h1>
          <p class="subtitle">Point your camera at a marker to play videos</p>
          <p class="hint" style="margin: 20px 0; color: #666;">
            Make sure you have <code>assets/target.mind</code> and <code>assets/video.mp4</code> in your project
          </p>
          <button id="start-ar-btn" class="btn btn-primary">
            Start AR Experience
          </button>
        </div>
      </div>

      <!-- AR View Screen -->
      <div id="ar-screen" class="screen">
        <div id="ar-container"></div>

        <!-- UI Overlay -->
        <div class="ar-overlay">
          <div class="ar-header">
            <button id="back-btn" class="icon-btn">←</button>
            <div class="tracking-status">
              <span id="tracking-indicator" class="status-dot"></span>
              <span id="tracking-text">Searching for marker...</span>
            </div>
            <button id="debug-toggle" class="icon-btn">⚙️</button>
          </div>

          <div id="debug-panel" class="debug-panel hidden">
            <h4>Debug Info</h4>
            <div class="debug-item">
              <span>Confidence:</span>
              <span id="debug-confidence">0.00</span>
            </div>
            <div class="debug-item">
              <span>FPS:</span>
              <span id="debug-fps">0</span>
            </div>
            <div class="debug-item">
              <span>Position:</span>
              <span id="debug-position">0, 0, 0</span>
            </div>
            <div class="debug-item">
              <span>Rotation:</span>
              <span id="debug-rotation">0, 0, 0</span>
            </div>
          </div>

          <div class="ar-footer">
            <div id="user-message" class="user-message"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

    <!-- Import Map for ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/",
          "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
      }
    </script>

    <!-- Load Three.js as ES module and expose as global -->
    <script type="module">
      import * as THREE from "three";
      window.THREE = THREE;
      console.log("Three.js loaded and exposed as global");
      window.dispatchEvent(new CustomEvent("three-ready"));
    </script>

    <!-- Load MindAR and expose as global -->
    <script type="module">
      import { MindARThree } from "mindar-image-three";

      // Expose MindARThree as a global for non-module scripts
      window.MINDAR = { MindARThree };
      window.MindARThree = MindARThree;

      console.log("MindAR loaded and exposed as global");

      // Dispatch event to notify that MindAR is ready
      window.dispatchEvent(new CustomEvent("mindar-ready"));
    </script>

    <!-- Application Scripts -->
    <script src="utils/smoothing.js"></script>
    <script src="utils/arTracker.js"></script>
    <script src="components/VideoOverlay.js"></script>
    <script src="components/CameraView.js"></script>
    <script src="App.js"></script>
  </body>
</html>

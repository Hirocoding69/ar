<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR Image Tracking Demo</title>
    <!-- Import map for resolving bare module specifiers -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image-three.prod.js"
        }
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        overflow: hidden;
        background: #000;
      }

      #container {
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px 20px;
        border-radius: 8px;
        z-index: 100;
        font-size: 14px;
        line-height: 1.6;
      }

      #info h1 {
        margin-bottom: 10px;
        font-size: 18px;
      }

      #status {
        margin-top: 10px;
        padding: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
      }

      .status-detecting {
        color: #ffa500;
      }

      .status-tracking {
        color: #4caf50;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="info">
      <h1>🎯 MindAR Image Tracking</h1>
      <p>Point your camera at the target image to see the 3D model.</p>
      <div id="status" class="status-detecting">Status: Initializing...</div>
    </div>

    <!-- MindAR will be loaded via dynamic import in main.js -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
